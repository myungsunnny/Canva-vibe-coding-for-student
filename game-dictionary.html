                    "선택에 따라 호감도 점수가 달라지고 결말이 바뀌게 하기",
                    "장면마다 배경 그림이나 이모지 배경 넣기"
                ],
                "caution": "이야기는 직접 쓴 내용으로 하고, 소설·영화의 줄거리와 실존 인물의 이름은 그대로 쓰지 않습니다."
            },
            {
                "id": "escape-room",
                "category": "story",
                "koName": "방탈출 게임",
                "enName": "Escape Room",
                "tags": [
                    "단서",
                    "추리",
                    "비밀번호"
                ],
                "description": "방 안의 물건을 눌러 단서를 찾고 비밀번호를 풀어 문을 여는 게임입니다. 순서와 조건을 생각하는 힘을 기를 수 있습니다.",
                "howItWorks": [
                    "방 안의 물건을 누르면 단서 글이나 아이템이 나옵니다.",
                    "모은 단서로 자물쇠의 비밀번호 4자리를 맞춥니다.",
                    "제한시간 안에 문을 열면 탈출 성공입니다."
                ],
                "difficulty": 4,
                "exampleIdeas": [
                    "과학실 속 숨은 실험 도구 찾기",
                    "수학 문제를 풀어 금고 열기",
                    "역사 박물관에서 유물 단서 찾기"
                ],
                "uiParts": [
                    "인벤토리 & 그리드 슬롯",
                    "대화창 (다이얼로그 박스)",
                    "알림 배너 & 퀘스트 트래커",
                    "게임 오버 / 결과 모달창"
                ],
                "prompt": "초등 고학년과 중학생이 즐길 수 있는 한 페이지 방탈출 게임을 만들어줘. 배경은 과학실이고 책상, 칠판, 시계, 서랍을 누르면 단서 글이 나와. 단서 3개를 모으면 금고의 4자리 비밀번호를 알 수 있고, 숫자 입력칸에 맞게 입력하면 문이 열려. 틀리면 '다시 생각해 보자'라는 안내를 보여주고, 힌트 버튼은 3번까지만 쓸 수 있게 해줘. 제한시간은 5분이고 위쪽에 남은 시간과 모은 단서를 보여줘. 성공하면 탈출 시간을 알려 주는 결과 화면과 다시 하기 버튼을 보여줘. 디자인은 이모지와 단순한 도형으로 깔끔하게 만들어줘. 이름, 학교, 전화번호, 사진 같은 개인정보는 넣지 말아줘.",
                "upgrade": [
                    "방을 2개로 늘려 첫 번째 방의 열쇠로 두 번째 방 열기",
                    "힌트를 쓸 때마다 최종 점수가 줄어들게 하기"
                ],
                "caution": "무섭거나 위험한 장면 대신 학습 퍼즐 중심으로 만들고, 실제 학교 이름·교실 사진은 사용하지 않습니다."
            }
        ];

        // 유형별 정적 미리보기 이모지 (분위기 표현)
        const previewEmojis = {
            'runner-jump': { bg: 'from-sky-900/60 to-slate-950', items: ['☁️', '🐤', '🏛️', '⭐'] },
            'space-shooter': { bg: 'from-indigo-950 to-slate-950', items: ['☄️', '🚀', '✨', '☄️', '🪐'] },
            'whack-a-mole': { bg: 'from-emerald-900/60 to-slate-950', items: ['🕳️', '🐹', '🕳️', '🕳️', '🌱'] },
            'snake-arcade': { bg: 'from-lime-900/50 to-slate-950', items: ['🚂', '🚃', '🚃', '🍎'] },
            'tower-defense': { bg: 'from-amber-900/40 to-slate-950', items: ['💨', '🛤️', '🔫', '🏫'] },
            'sliding-puzzle': { bg: 'from-violet-900/50 to-slate-950', items: ['1️⃣', '2️⃣', '3️⃣', '⬜', '4️⃣'] },
            'match-three': { bg: 'from-rose-900/40 to-slate-950', items: ['🥫', '🍾', '📄', '🥫', '🧴'] },
            'quiz-challenge': { bg: 'from-blue-900/50 to-slate-950', items: ['❓', '🅰️', '🅱️', '✅'] },
            'memory-cards': { bg: 'from-fuchsia-900/40 to-slate-950', items: ['🃏', '🐶', '🃏', '🐶', '🐱'] },
            'clicker-tycoon': { bg: 'from-yellow-900/40 to-slate-950', items: ['🪴', '💧', '🪙', '🌸'] },
            'text-adventure': { bg: 'from-orange-950/70 to-slate-950', items: ['📖', '🗝️', '🗺️', '🧭'] },
            'escape-room': { bg: 'from-teal-900/50 to-slate-950', items: ['🚪', '🔒', '🔍', '🧪', '⏰'] }
        };

        // 상태 변수
        let currentCategory = 'all';
        let searchQuery = '';

        // DOM 요소
        const genreGrid = document.getElementById('genreGrid');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const categoryBtns = document.querySelectorAll('.category-btn');

        // HTML 이스케이프 (innerHTML 삽입 전 필수)
        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 난이도 별 (★ 채움 / ☆ 빈칸, 총 5개)
        function renderStars(level) {
            const n = Math.max(1, Math.min(5, Number(level) || 1));
            return '★'.repeat(n) + '☆'.repeat(5 - n);
        }

        // 이모지 미리보기 박스
        function renderPreview(item) {
            const p = previewEmojis[item.id] || { bg: 'from-slate-900 to-slate-950', items: ['🎮'] };
            const emojis = p.items.map(e => `<span class="text-3xl">${escapeHtml(e)}</span>`).join('');
            return `
                <div class="w-full h-36 bg-gradient-to-br ${p.bg} rounded-xl border border-slate-700 flex items-center justify-center gap-3 flex-wrap p-3 select-none" aria-hidden="true">
                    ${emojis}
                </div>`;
        }

        // 카드 렌더링 함수
        function renderCards() {
            const q = searchQuery.trim().toLowerCase();
            const entries = gameGenreData
                .map((item, index) => ({ item, index }))
                .filter(({ item }) => {
                    const matchCategory = currentCategory === 'all' || item.category === currentCategory;
                    const matchSearch = !q ||
                        item.koName.toLowerCase().includes(q) ||
                        item.enName.toLowerCase().includes(q) ||
                        item.description.toLowerCase().includes(q) ||
                        item.tags.some(tag => tag.toLowerCase().includes(q));
                    return matchCategory && matchSearch;
                });

            if (entries.length === 0) {
                genreGrid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            genreGrid.innerHTML = entries.map(({ item, index }) => `
                <article class="bg-slate-800/70 border border-slate-700/80 hover:border-indigo-500/50 rounded-2xl p-5 flex flex-col justify-between shadow-lg transition-all duration-200 hover:-translate-y-1">
                    <div>
                        <!-- 영문명 배지 · 한글명 · 난이도 -->
                        <div class="mb-3">
                            <span class="inline-block text-[11px] font-mono font-bold text-indigo-300 bg-indigo-950/80 border border-indigo-500/30 px-2.5 py-0.5 rounded-md mb-1.5">
                                ${escapeHtml(item.enName)}
                            </span>
                            <h3 class="text-lg font-bold text-white">${escapeHtml(item.koName)}</h3>
                            <p class="text-xs text-slate-300 mt-1">
                                만들기 난이도
                                <span class="text-amber-300 tracking-wider ml-1" role="img" aria-label="난이도 5점 만점에 ${escapeHtml(item.difficulty)}점">${escapeHtml(renderStars(item.difficulty))}</span>
                            </p>
                        </div>

                        <!-- 이모지 미리보기 -->
                        <div class="mb-4">${renderPreview(item)}</div>

                        <!-- 설명 -->
                        <p class="text-sm text-slate-300 leading-relaxed mb-4">${escapeHtml(item.description)}</p>

                        <!-- 해시태그 -->
                        <div class="flex flex-wrap gap-1.5 mb-4">
                            ${item.tags.map(tag => `<span class="text-[11px] bg-slate-900 text-slate-300 px-2 py-0.5 rounded-md">#${escapeHtml(tag)}</span>`).join('')}
                        </div>

                        <!-- 핵심 규칙 -->
                        <h4 class="text-xs font-bold text-indigo-300 mb-1.5">핵심 규칙</h4>
                        <ol class="list-decimal list-inside text-sm text-slate-300 space-y-1 mb-4">
                            ${item.howItWorks.slice(0, 3).map(r => `<li>${escapeHtml(r)}</li>`).join('')}
                        </ol>

                        <!-- 우리 반 소재 아이디어 -->
                        <h4 class="text-xs font-bold text-indigo-300 mb-1.5">우리 반 소재 아이디어</h4>
                        <ul class="list-disc list-inside text-sm text-slate-300 space-y-1 mb-4">
                            ${item.exampleIdeas.slice(0, 3).map(r => `<li>${escapeHtml(r)}</li>`).join('')}
                        </ul>

                        <!-- 필요한 UI 부품 -->
                        <h4 class="text-xs font-bold text-indigo-300 mb-1.5">필요한 UI 부품</h4>
                        <div class="flex flex-wrap gap-1.5 mb-4">
                            ${item.uiParts.map(p => `<span class="text-[11px] bg-indigo-950/80 text-indigo-200 border border-indigo-500/30 px-2 py-0.5 rounded-md">${escapeHtml(p)}</span>`).join('')}
                        </div>

                        <!-- 레벨업 아이디어 -->
                        <h4 class="text-xs font-bold text-emerald-300 mb-1.5">레벨업 아이디어</h4>
                        <ul class="list-disc list-inside text-sm text-slate-300 space-y-1 mb-4">
                            ${item.upgrade.slice(0, 2).map(r => `<li>${escapeHtml(r)}</li>`).join('')}
                        </ul>
                    </div>

                    <div>
                        <!-- 프롬프트 예시 박스 -->
                        <div class="bg-slate-900/90 border border-slate-700/80 rounded-xl p-3 mb-3">
                            <div class="flex justify-between items-center mb-1.5">
                                <span class="text-[11px] font-bold text-emerald-300 flex items-center gap-1">
                                    <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> 프롬프트 복사
                                </span>
                                <button type="button" data-index="${index}" aria-label="${escapeHtml(item.koName)} 프롬프트 복사" class="copy-btn text-xs bg-slate-800 hover:bg-indigo-600 text-slate-200 hover:text-white px-2.5 py-1 rounded-lg border border-slate-600 hover:border-indigo-500 transition flex items-center gap-1.5 font-medium">
                                    <i class="fa-regular fa-copy" aria-hidden="true"></i> 복사
                                </button>
                            </div>
                            <p class="text-xs text-slate-300 leading-relaxed select-all">"${escapeHtml(item.prompt)}"</p>
                        </div>

                        <!-- 저작권·안전 유의 -->
                        <p class="text-xs text-amber-200 bg-amber-950/50 border border-amber-500/40 rounded-lg px-3 py-2 leading-relaxed">
                            ⚠️ ${escapeHtml(item.caution)}
                        </p>
                    </div>
                </article>
            `).join('');
        }

        // 카테고리 탭 이벤트
        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryBtns.forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white', 'font-bold');
                    b.classList.add('bg-slate-800', 'text-slate-300', 'font-medium');
                });
                btn.classList.remove('bg-slate-800', 'text-slate-300', 'font-medium');
                btn.classList.add('bg-indigo-600', 'text-white', 'font-bold');

                currentCategory = btn.dataset.category;
                renderCards();
            });
        });

        // 검색 이벤트
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderCards();
        });

        // 복사 버튼: data-index 로 데이터 배열에서 프롬프트를 읽음
        genreGrid.addEventListener('click', (e) => {
            const btn = e.target.closest('.copy-btn');
            if (!btn) return;
            const item = gameGenreData[Number(btn.dataset.index)];
            if (item) copyPrompt(item.prompt);
        });

        // 클립보드 복사 함수 (iFrame 호환)
        function copyPrompt(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                const ok = document.execCommand('copy');
                showToast(ok ? '프롬프트가 복사되었습니다! AI 채팅창에 붙여넣어 보세요.' : '복사에 실패했습니다.');
            } catch (err) {
                showToast('복사에 실패했습니다.');
            }
            document.body.removeChild(textarea);
        }

        // 토스트 알림 표시
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.querySelector('span').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // 초기 실행
        window.onload = () => {
            renderCards();
        };

        // 발표자료(index.html) 안에서 열렸을 때: Esc 키로 사전 닫기
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && window.parent !== window) {
                window.parent.postMessage('ui-dict-close', '*');
            }
        });
    </script>
</body>
</html>
